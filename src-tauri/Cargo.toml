[package]
name = "incask"
version = "0.1.0"
description = "IncAsk — จัดหมวดหมู่อินซิเดนต์/ทิกเก็ตด้วย LLM ผ่าน Gateway ของบริษัท"
edition = "2021"
rust-version = "1.77"

[lib]
name = "incask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# rustls + Windows certificate store (corporate CA); system proxy is read by reqwest on Windows. (same as DocAsk)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "http2", "charset"] }
keyring = { version = "3", features = ["windows-native"] }
dirs = "5"
regex = "1"
once_cell = "1"
log = "0.4"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
calamine = "0.38"
csv = "1"
encoding_rs = "0.8"
sha2 = "0.10"
hex = "0.4"
rust_xlsxwriter = "0"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
